substitutions:
  name: apollo-air-1-344c44
  friendly_name: Apollo AIR-1 344c44
packages:
  ApolloAutomation.AIR-1: github://ApolloAutomation/AIR-1/Integrations/ESPHome/AIR-1.yaml
esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
api:
  # encryption:
  #   key: U6V4BV2Dmb+Drcz10SSrwmk0pT/UMeVQ/xox2yzhk8I=


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  - platform: scd4x
    id: !extend scd40
    update_interval: 20s

  - platform: sen5x
    id: !extend sen55
    update_interval: 20s
    temperature:
      name: "SEN55 Temperature"
      id: sen55_temperature     # ←-- NEW
      accuracy_decimals: 1
      filters:
        - lambda: return x - id(sen55_temperature_offset).state;
    humidity:
      name: "SEN55 Humidity"
      id: sen55_humidity        # ←-- NEW
      accuracy_decimals: 1
      filters:
        - lambda: return x - id(sen55_humidity_offset).state;

  - platform: template
    id: wet_bulb
    name: "Wet-Bulb Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    icon: mdi:water-thermometer
    accuracy_decimals: 1
    update_interval: 20s        # keep it in sync
    lambda: |-
      const float t  = id(sen55_temperature).state;  // dry-bulb °C
      const float rh = id(sen55_humidity).state;     // RH %

      // Stull (2011) wet-bulb approximation
      const float a = t * atan(0.151977f * sqrtf(rh + 8.313659f));
      const float b = atan(t + rh) - atan(rh - 1.676331f);
      const float c = 0.00391838f * powf(rh, 1.5f) * atan(0.023101f * rh);
      return a + b + c - 4.686035f;   // °C

switch:
  - platform: template
    name: "Startup Light Blink"
    id: startup_light_blink
    icon: mdi:lightbulb
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: "config"

#Used To Control RGB Light On Startup. Tells User Status Of Device
interval:
  - interval: 1s
    then:
      - if:
          condition:
            - binary_sensor.is_off: ink_ha_connected
            - lambda: 'return id(cycleCounter) < 30;'
            - switch.is_on: startup_light_blink

          then:
            - light.turn_on:
                id: rgb_light
                brightness: 100%
                red: !lambda 'return std::strtol(get_mac_address().substr(6, 2).c_str(), nullptr, 16) / 255.0f;'
                green: !lambda 'return std::strtol(get_mac_address().substr(8, 2).c_str(), nullptr, 16) / 255.0f;'
                blue: !lambda 'return std::strtol(get_mac_address().substr(10, 2).c_str(), nullptr, 16) / 255.0f;'
            - lambda: 'id(cycleCounter) += 1;'

  - interval: 1s
    then:
      - if:
          condition:
            - binary_sensor.is_off: ink_ha_connected
            - lambda: 'return id(cycleCounter) > 30;'
            - lambda: 'return id(cycleCounter) < 31;'
            - switch.is_on: startup_light_blink

          then:
            - light.turn_off:
                id: rgb_light
            - lambda: 'id(cycleCounter) += 1;'

bluetooth_proxy: